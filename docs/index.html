/* Layout: barra de etapas arriba, una vista por etapa, resumen antes del detalle. */
:root {

}
@media (prefers-color-scheme: dark) {

}

* { box-sizing: border-box; }

.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
.tile .v { font: 600 30px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.tile .v small { font-size: 16px; color: var(--muted); font-weight: 500; }
.tile .k { color: var(--muted); font-size: 13px; margin-top: 4px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
.two { grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); align-items: start; }

.note { border-left: 3px solid var(--warning); background: var(--surface); padding: 10px 14px; border-radius: 0 6px 6px 0; color: var(--muted); font-size: 14px; margin: 0 0 18px; max-width: 80ch; }
.scroll { overflow-x: auto; }

.mono { font-family: var(--font-mono); font-size: 13px; }
.pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px 1px 7px; font-size: 12.5px; white-space: nowrap; background: var(--surface); }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.pill.good i { background: var(--good); } .pill.warning i { background: var(--warning); }
.pill.serious i { background: var(--serious); } .pill.critical i { background: var(--critical); }
.stage { display: block; text-decoration: none; color: inherit; }
.stage:hover { border-color: var(--accent); }
.stage .tag { font-family: var(--font-mono); font-size: 12px; color: var(--accent); }
.stage p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.stages { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.filters { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; align-items: end; }

select, button { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
button { cursor: pointer; } button:hover { border-color: var(--accent); }

.asset { cursor: pointer; }
.asset rect { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }

.flow { fill: none; stroke: var(--muted); stroke-width: 1.4; opacity: .55; }
.flow.bad { stroke: var(--critical); stroke-dasharray: 6 4; stroke-width: 2; opacity: .95; }
.flow.hi { stroke-width: 3.5; opacity: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; color: var(--muted); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 22px; height: 0; border-top: 2px solid var(--muted); }
.sw.bad { border-top: 2px dashed var(--critical); }
.sq { width: 12px; height: 12px; border-radius: 3px; }
.matrix { display: grid; grid-template-columns: 28px repeat(5, minmax(0, 1fr)); gap: 2px; font-size: 12px; }
.matrix .ax { display: flex; align-items: center; justify-content: center; color: var(--muted); font-variant-numeric: tabular-nums; }

.q { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }

.livehead { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; justify-content: space-between; }

.ev { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; padding: 8px 0 8px 10px; border-bottom: 1px solid var(--line); border-left: 3px solid var(--line); font-size: 14px; }

.ev.new { animation: flash 1.2s ease-out; }

.chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }

.lsw { width: 16px; height: 3px; border-radius: 2px; background: var(--mark); }

footer { margin-top: 40px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); padding-top: 14px; }

/* ---------- Arquitectura ---------- */
(function () {
  const A = DATA.architecture, V = DATA.validation;
  const W = 800, BH = 96, LX = 150, BW = 140, BX = 44;
  const pos = {};
  A.zones.forEach((z, zi) => {
    const list = A.assets.filter(a => a.zone === z.id);
    list.forEach((a, i) => { pos[a.id] = { x: LX + (W - LX) * (i + 1) / (list.length + 1), y: zi * BH + BH / 2, zi }; });
  });
  const H = A.zones.length * BH;
  function path(f) {
    const s = pos[f.src], d = pos[f.dst];
    if (s.zi === d.zi) {
      const dir = d.x > s.x ? 1 : -1;
      return `M${s.x + dir * BW / 2},${s.y} L${d.x - dir * BW / 2},${d.y}`;
    }
    const dir = d.zi > s.zi ? 1 : -1;
    const y1 = s.y + dir * BX / 2, y2 = d.y - dir * BX / 2, my = (y1 + y2) / 2;
    return `M${s.x},${y1} C${s.x},${my} ${d.x},${my} ${d.x},${y2}`;
  }
  const bands = A.zones.map((z, i) => `
    <rect x="0" y="${i * BH}" width="${W}" height="${BH - 4}" rx="6" fill="var(--accent-soft)" opacity="${i % 2 ? .55 : .9}"/>
    <text x="12" y="${i * BH + 26}" font-size="14" font-weight="600">${esc(z.short || z.name)}</text>
    <text x="12" y="${i * BH + 44}" font-size="12" class="muted">${esc(z.purdue)}</text>`).join("");
  const flows = V.flows.map(f => `<path id="fl-${f.id}" class="flow ${f.status === "violación" ? "bad" : ""}" d="${path(f)}" marker-end="url(#${f.status === "violación" ? "arB" : "arA"})" data-tip="${esc(f.id + ": " + assetById[f.src].name + " → " + assetById[f.dst].name + " (" + f.protocol + ", puerto " + f.port + "). " + f.reason)}"/>`);
  const boxes = A.assets.map(a => { const p = pos[a.id]; return `
    <g class="asset" id="as-${a.id}" data-id="${a.id}" tabindex="0" role="button" aria-label="${esc(a.name)}">
      <rect x="${p.x - BW / 2}" y="${p.y - BX / 2}" width="${BW}" height="${BX}" rx="6"/>
      <text x="${p.x}" y="${p.y - 1}" text-anchor="middle" font-size="13" font-weight="500">${esc(a.name)}</text>
      <text x="${p.x}" y="${p.y + 14}" text-anchor="middle" font-size="11" class="muted" font-family="var(--font-mono)">${a.ip}</text>
    </g>`; }).join("");
  $("#v-arquitectura").innerHTML = `
  <h2>Arquitectura de referencia</h2>
  <p class="lead">${A.zones.length} zonas unidas por ${A.conduits.length} conductos. De ${V.flows.length} flujos declarados, ${V.violations} cruzan entre zonas sin un conducto que los permita. Es un escenario hipotético, no un despliegue real. Seleccioná un activo para ver sus amenazas.</p>
  <div class="grid two">
    <div class="card">
      <div class="scroll"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:640px" role="img" aria-label="Diagrama de zonas, activos y flujos">
        <defs>
          <marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker>
          <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--critical)"/></marker>
        </defs>
        ${bands}<g>${flows.join("")}</g>${boxes}
      </svg></div>
      <div class="legend"><span><i class="sw"></i>Flujo permitido por un conducto</span><span><i class="sw bad"></i>Flujo que viola la segmentación</span></div>
    </div>
    <div class="card" id="asset-detail"></div>
  </div>
  <div class="card" style="margin-top:14px"><h3>Flujos validados</h3><div class="scroll"><table>
    <thead><tr><th>Flujo</th><th>Origen</th><th>Destino</th><th>Protocolo</th><th class="num">Puerto</th><th>Estado</th><th>Motivo</th></tr></thead>
    <tbody>${V.flows.map(f => `<tr class="pick" data-flow="${f.id}"><td class="mono">${f.id}</td><td>${esc(assetById[f.src].name)}</td><td>${esc(assetById[f.dst].name)}</td><td>${esc(f.protocol)}</td><td class="num">${f.port}</td><td>${pill(f.status === "violación" ? "critical" : "good", f.status === "violación" ? "Violación" : "Permitido")}</td><td>${esc(f.reason)}${f.note ? `. ${esc(f.note)}` : ""}</td></tr>`).join("")}</tbody>
  </table></div></div>`;
  function show(id) {
    const a = assetById[id], z = zoneById[a.zone];
    document.querySelectorAll(".asset").forEach(g => g.classList.toggle("sel", g.dataset.id === id));
    const ths = DATA.threats.filter(t => t.asset === id);
    const fl = V.flows.filter(f => f.src === id || f.dst === id);
    $("#asset-detail").innerHTML = `<h3>${esc(a.name)}</h3>
      <dl class="kv"><dt>Tipo</dt><dd>${esc(a.type)}</dd><dt>Zona</dt><dd>${esc(z.name)} (${esc(z.purdue)})</dd>${z.frameworks.length ? `<dt>Marcos</dt><dd>${z.frameworks.map(esc).join("; ")}</dd>` : ""}<dt>Dirección</dt><dd class="mono">${a.ip}</dd></dl>
      <p style="color:var(--muted);font-size:14px">${esc(a.description)}</p>
      <h3>Amenazas (${ths.length})</h3>
      ${ths.length ? `<ul class="plain">${ths.map(t => `<li><span class="mono">${t.id}</span> ${esc(t.title)} ${pill(LEVEL_CLASS[t.level], t.level)}</li>`).join("")}</ul>` : `<p style="color:var(--muted);font-size:14px">Sin amenazas modeladas para este activo.</p>`}
      <h3 style="margin-top:14px">Flujos (${fl.length})</h3>
      <ul class="plain">${fl.map(f => `<li><span class="mono">${f.id}</span> ${esc(assetById[f.src].name)} → ${esc(assetById[f.dst].name)}${f.status === "violación" ? " " + pill("critical", "Violación") : ""}</li>`).join("")}</ul>`;
  }
  document.querySelectorAll(".asset").forEach(g => {
    g.addEventListener("click", () => show(g.dataset.id));
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); show(g.dataset.id); } });
  });
  document.querySelectorAll("tr[data-flow]").forEach(tr => {
    const el = document.getElementById("fl-" + tr.dataset.flow);
    tr.addEventListener("mouseenter", () => el.classList.add("hi"));
    tr.addEventListener("mouseleave", () => el.classList.remove("hi"));
  });
  show("inversor");
})();

        <dt>Laboratorio</dt><dd>${sc ? `Escenario <span class="mono">${sc.id}</span> ` : ""}${pill(OUTCOME_CLASS[st] || "", st[0].toUpperCase() + st.slice(1))}${sc && sc.fired_rules.length ? `<br>Reglas: <span class="mono">${sc.fired_rules.join(", ")}</span>` : ""}</dd>

      <h3 style="margin-top:14px">Controles</h3><ul class="plain">${t.controls.map(c => `<li>${esc(c)}</li>`).join("")}</ul>`;
  }
  root.addEventListener("click", e => {

    }
    const el = e.target.closest("[data-t]"); if (el) { sel = el.dataset.t; draw(); }
  });
  root.addEventListener("change", draw);
  draw();
})();

  function startRecorded() {

      <pre class="cmd">python -m lab.live --replay ataque.pcap --baseline normal.pcap</pre></div>`;
    let timer = null;
    function inventoryAt(rec, f) {
      let devices = [];
      for (const s of rec.shapes) if (s.frame <= f) devices = s.devices;
      const counts = rec.frames[f][3];
      return devices.map((d, i) => ({ ...d, requests: counts[i] || 0, writes: Object.fromEntries(Object.entries(d.writes).map(([r, w]) => [r, { min: w[0], max: w[1] }])) }));
    }
    function load(i) {
      clearInterval(timer);
      const rec = recs[i];
      document.querySelectorAll(".rec-pick").forEach(b => b.setAttribute("aria-pressed", +b.dataset.i === i));
      $("#rec-desc").textContent = `${rec.description} ${rec.policy_label}.`;
      $("#rec-src").textContent = rec.source ? `Captura ${rec.capture}. Fuente: ${rec.source}.` : `Captura ${rec.capture}.`;
      let speed = 60;
      const show = (f, playing) => { const fr = rec.frames[f]; view.state({ elapsed: fr[0], total: rec.seconds, speed, requests: fr[1], rate: fr[2], inventory: inventoryAt(rec, f), playing, finished: f === rec.frames.length - 1 }); };
      function play() {
        clearInterval(timer);
        view.clear();
        let elapsed = 0, f = -1, shown = 0;
        timer = setInterval(() => {
          elapsed += 0.1 * speed;
          while (shown < rec.alerts.length && rec.alerts[shown].second <= elapsed) view.alert(rec.alerts[shown++]);
          let moved = false;
          while (f + 1 < rec.frames.length && rec.frames[f + 1][0] <= elapsed) { f++; moved = true; show(f, f < rec.frames.length - 1); }
          if (f === rec.frames.length - 1) clearInterval(timer);
        }, 100);
      }
      const view = replayView($("#rec-box"), rec, { restart: play, speed: v => { speed = v; view.state && $("#rec-box [data-r=speed]") && ($("#rec-box [data-r=speed]").textContent = `actual ${v}×`); } });
      /* En reposo se muestra el resultado completo */
      rec.frames.forEach((_, f) => show(f, false));
      rec.alerts.forEach(a => view.alert(a, false));
    }

    load(0);
  }

    });
    $("#lv-reset").addEventListener("click", () => fetch("reset", { method: "POST" }));

    const es = new EventSource("events");
    es.onopen = () => { $("#lv-conn").className = "pill good"; $("#lv-conn").innerHTML = "<i></i>Sensor en vivo"; };
    es.onerror = () => { $("#lv-conn").className = "pill critical"; $("#lv-conn").innerHTML = "<i></i>Sin conexión con el laboratorio"; };
    es.addEventListener("state", e => {
      const s = JSON.parse(e.data);
      const rep = s.potencia_reportada_w == null ? s.potencia_w : s.potencia_reportada_w;
      $("#lv-pot").innerHTML = `${s.potencia_w} <small>W</small>`;
      $("#lv-rep").innerHTML = `${rep} <small>W</small>`;
      $("#lv-lim").innerHTML = `${s.limite_pct} <small>%</small>`;
      $("#lv-con").innerHTML = pill(s.conectado ? "good" : "critical", s.conectado ? "Conectado" : "Desconectado");
      $("#lv-rate").textContent = s.solicitudes_por_segundo;
      hist.push({ t: s.time, pot: s.potencia_w, rep, rate: s.solicitudes_por_segundo });
      while (hist.length > 200) hist.shift();
      chart("#lv-chart-pot", "pot", "#lv-c-pot", "W", 4000, "rep");
      chart("#lv-chart-rate", "rate", "#lv-c-rate", "por segundo", 50);
    });
    es.addEventListener("alert", e => {
      const a = JSON.parse(e.data); alerts++; $("#lv-al").textContent = alerts;
      addEvent(`${pill(a.severity === "alta" ? "serious" : "warning", "Alerta " + a.severity)} <span class="mono">${a.rule}</span> <b>${esc(a.name)}</b> <span class="mono">${a.technique}</span><br>${esc(a.detail)} · origen <span class="mono">${a.source}</span>`, "alert", a.time);
    });
    es.addEventListener("attack", e => { const a = JSON.parse(e.data); addEvent(`Ataque lanzado: <span class="mono">${a.id}</span> ${esc(a.name)}`, "info", a.time); });
    es.addEventListener("reset", e => addEvent("Inversor restablecido: límite 100 % y conectado", "info", JSON.parse(e.data).time));
  }
})();

/* ---------- Expertos ---------- */
(function () {
  const E = DATA.experts;
  const items = E.items.slice().sort((a, b) => b.median - a.median || a.id.localeCompare(b.id));
  const W = 640, RH = 26, LX = 300, PW = W - LX - 20, H = items.length * RH + 30;
  const x = v => LX + (v - 1) / 4 * PW;
  const rows = items.map((it, i) => {
    const y = i * RH + RH / 2, t = threatById[it.id];
    const title = t.title.length > 38 ? t.title.slice(0, 37) + "…" : t.title;
    return `<g data-tip="${esc(it.id + " " + t.title + ". Mediana " + it.median + ", rango intercuartil " + it.q1 + " a " + it.q3 + ".")}">
      <rect x="0" y="${i * RH}" width="${W}" height="${RH}" fill="transparent"/>
      <text x="0" y="${y + 4}" font-size="12" font-family="var(--font-mono)">${it.id}</text>
      <text x="36" y="${y + 4}" font-size="12.5">${esc(title)}</text>
      <line x1="${x(it.q1)}" x2="${x(it.q3)}" y1="${y}" y2="${y}" stroke="var(--mark)" stroke-width="6" stroke-linecap="round" opacity=".35"/>
      <circle cx="${x(it.median)}" cy="${y}" r="5.5" fill="var(--mark)" stroke="var(--surface)" stroke-width="2"/>
    </g>`;
  }).join("");
  const grid = [1, 2, 3, 4, 5].map(v => `<line x1="${x(v)}" x2="${x(v)}" y1="0" y2="${items.length * RH}" stroke="var(--line)"/><text x="${x(v)}" y="${items.length * RH + 18}" font-size="12" text-anchor="middle" class="muted">${v}</text>`).join("");
  const agree = E.items.filter(i => i.consensus).length;
  $("#v-expertos").innerHTML = `
  <h2>Consulta a expertos</h2>
  <p class="note">Las respuestas de esta vista son sintéticas, generadas para mostrar el análisis. Se reemplazan cargando el CSV real de la consulta.</p>
  <p class="lead">Cada experto califica la relevancia de cada amenaza de 1 a 5. El coeficiente W de Kendall mide el acuerdo general: 0 es ninguno y 1 es total.</p>
  <div class="grid tiles">
    <div class="tile"><div class="v">${E.experts}</div><div class="k">expertos consultados</div></div>
    <div class="tile"><div class="v">${E.kendall_w.toFixed(2)}</div><div class="k">W de Kendall (acuerdo general)</div></div>
    <div class="tile"><div class="v">${agree} <small>de ${E.items.length}</small></div><div class="k">amenazas con consenso (rango intercuartil de 1 o menos)</div></div>
    <div class="tile"><div class="v">${E.spearman_vs_model.toFixed(2)}</div><div class="k">correlación de Spearman con el riesgo del modelo</div></div>
  </div>
  <div class="card"><h3>Relevancia según los expertos, por amenaza</h3>
    <div class="scroll"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:560px;max-width:820px" role="img" aria-label="Mediana y rango intercuartil de relevancia por amenaza">${grid}${rows}</svg></div>
    <div class="legend"><span><svg width="14" height="14"><circle cx="7" cy="7" r="5" fill="var(--mark)"/></svg>Mediana</span><span><svg width="26" height="14"><line x1="3" x2="23" y1="7" y2="7" stroke="var(--mark)" stroke-width="6" stroke-linecap="round" opacity=".35"/></svg>Rango intercuartil</span><span>Escala: 1 poco relevante, 5 muy relevante</span></div>
  </div>`;
})();

/* ---------- Madurez ---------- */
(function () {
  const M = DATA.maturity, KEY = "der-ot-madurez-v1";
  const qs = M.domains.flatMap(d => d.questions.map(q => ({ ...q, domain: d.id })));
  const EXAMPLE = { q1: 1, q2: 1, q3: 0, q4: 1, q5: 2, q6: 1, q7: 2, q8: 1, q9: 0, q10: 0, q11: 0, q12: 1, q13: 1, q14: 2, q15: 3, q16: 1, q17: 1, q18: 0 };
  let ans = null, isExample = true;
  try { const saved = JSON.parse(localStorage.getItem(KEY)); if (saved && typeof saved === "object") { ans = saved; isExample = false; } } catch (e) {}
  if (!ans) ans = { ...EXAMPLE };
  const root = $("#v-madurez");
  root.innerHTML = `
  <h2>Indicadores de madurez</h2>
  <p class="lead">Autoevaluación para distribuidoras y cooperativas. Cada afirmación se califica de 0 a 3. ${esc(M.meta.note)}</p>
  <p class="note" id="m-state"></p>
  <div class="grid two">
    <div class="card">
      <div class="legend" style="margin:0 0 10px">${M.meta.levels.map((l, i) => `<span><b>${i}</b> ${esc(l)}</span>`).join("")}</div>
      ${M.domains.map(d => `<h3 style="margin-top:16px">${esc(d.name)}</h3>${d.questions.map(q => `<div class="q"><div>${esc(q.text)}</div><div class="seg" role="radiogroup" aria-label="${esc(q.text)}">${[0, 1, 2, 3].map(v => `<label data-tip="${esc(M.meta.levels[v])}"><input type="radio" name="${q.id}" id="${q.id}-${v}" value="${v}"><span>${v}</span></label>`).join("")}</div></div>`).join("")}`).join("")}
      <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap"><button id="m-clear" type="button">Borrar respuestas</button><button id="m-example" type="button">Cargar el ejemplo</button></div>
    </div>
    <div class="grid">
      <div class="card"><h3>Resultado</h3><div class="tile" style="border:0;padding:0"><div class="v" id="m-score"></div><div class="k" id="m-count"></div></div><div id="m-radar" style="margin-top:8px"></div><div id="m-bars"></div></div>
      <div class="card"><h3>Prioridades de mejora</h3><div id="m-advice"></div></div>
    </div>
  </div>`;
  function draw() {
    qs.forEach(q => [0, 1, 2, 3].forEach(v => { $(`#${q.id}-${v}`).checked = ans[q.id] === v; }));
    $("#m-state").textContent = isExample ? "Se muestran respuestas de ejemplo de una cooperativa tipo. Al cambiar cualquier respuesta, la evaluación pasa a ser la tuya y se guarda solo en este navegador." : "Tus respuestas se guardan solo en este navegador.";
    const dom = M.domains.map(d => {
      const vals = d.questions.map(q => ans[q.id]).filter(v => v != null);
      return { name: d.name, pct: vals.length ? vals.reduce((a, b) => a + b, 0) / (vals.length * 3) : 0, n: vals.length };
    });
    const all = qs.map(q => ans[q.id]).filter(v => v != null);
    const total = all.length ? Math.round(all.reduce((a, b) => a + b, 0) / (all.length * 3) * 100) : 0;
    $("#m-score").innerHTML = `${total} <small>%</small>`;
    $("#m-count").textContent = `madurez general, con ${all.length} de ${qs.length} respuestas`;
    const R = 88, C = 185, n = dom.length;
    const pt = (i, r) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [C + r * Math.cos(a), 125 + r * Math.sin(a)]; };
    const ring = f => dom.map((_, i) => pt(i, R * f).join(",")).join(" ");
    $("#m-radar").innerHTML = `<svg viewBox="0 0 370 250" width="100%" style="max-width:400px;display:block;margin:auto" role="img" aria-label="Madurez por dominio">
      ${[1 / 3, 2 / 3, 1].map(f => `<polygon points="${ring(f)}" fill="none" stroke="var(--line)"/>`).join("")}
      ${dom.map((_, i) => { const [x, y] = pt(i, R); return `<line x1="${C}" y1="125" x2="${x}" y2="${y}" stroke="var(--line)"/>`; }).join("")}
      <polygon points="${dom.map((d, i) => pt(i, R * d.pct).join(",")).join(" ")}" fill="var(--mark)" fill-opacity=".22" stroke="var(--mark)" stroke-width="2" stroke-linejoin="round"/>
      ${dom.map((d, i) => { const [x, y] = pt(i, R * d.pct); return `<circle cx="${x}" cy="${y}" r="4" fill="var(--mark)" stroke="var(--surface)" stroke-width="2" data-tip="${esc(d.name)}: ${Math.round(d.pct * 100)} %"/>`; }).join("")}
      ${dom.map((d, i) => { const [x, y] = pt(i, R + 14); const w = d.name.split(" "); return `<text x="${x}" y="${y + 4}" font-size="11" class="muted" text-anchor="${Math.abs(x - C) < 5 ? "middle" : x > C ? "start" : "end"}">${esc(w[0])}</text>`; }).join("")}
    </svg>`;
    $("#m-bars").innerHTML = dom.map(d => `<div class="drow"><span>${esc(d.name)}</span><div class="bar"><b style="width:${d.pct * 100}%"></b></div><span class="p">${Math.round(d.pct * 100)} %</span></div>`).join("");
    const low = qs.filter(q => ans[q.id] != null && ans[q.id] <= 1).sort((a, b) => ans[a.id] - ans[b.id]).slice(0, 5);
    $("#m-advice").innerHTML = low.length ? `<ol class="plain">${low.map(q => `<li style="margin-bottom:6px">${esc(q.advice)} <span style="color:var(--muted);font-size:13px">(nivel actual ${ans[q.id]})</span></li>`).join("")}</ol>`
      : `<p style="color:var(--muted);font-size:14px;margin:0">${all.length ? "Ninguna respuesta está en nivel 0 o 1." : "Respondé el cuestionario para ver las prioridades."}</p>`;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(ans)); } catch (e) {} }
  root.addEventListener("change", e => {
    if (e.target.type !== "radio") return;
    ans[e.target.name] = +e.target.value; isExample = false; save(); draw();
  });
  $("#m-clear").addEventListener("click", () => { ans = {}; isExample = false; save(); draw(); });
  $("#m-example").addEventListener("click", () => { ans = { ...EXAMPLE }; isExample = true; try { localStorage.removeItem(KEY); } catch (e) {} draw(); });
  draw();
})();

$("#foot").textContent = "Prototipo de investigación. El sensor fue validado con un laboratorio emulado y con cuatro capturas públicas; no fue probado en una red en operación.";
route();
</script>
</body>
</html>
