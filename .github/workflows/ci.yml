name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar la arquitectura
        run: python tools/validate_architecture.py
      - name: Pruebas
        run: python -m unittest -v
      - name: Ejecutar el laboratorio y generar el sitio
        run: |
          python -m lab.run_lab
          python web/build.py
