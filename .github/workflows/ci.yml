name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar la arquitectura
        run: python tools/validate_architecture.py
      - name: Pruebas
        run: python -m unittest -v
      - name: Ejecutar el laboratorio y generar el sitio
        run: |
          python -m lab.run_lab
          python web/build.py
      - name: Sensor sobre las capturas del laboratorio
        run: |
          python -m sensor learn results/pcap/S0.pcap -o /tmp/linea_base.json
          python -m sensor analyze results/pcap/S0.pcap --policy /tmp/linea_base.json --audit /tmp/auditoria.jsonl
          python -m sensor verify /tmp/auditoria.jsonl
          python -m sensor verify results/audit.jsonl
          python -m sensor propose results/pcap/S0.pcap --policy /tmp/linea_base.json
