<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ciberseguridad OT en redes con DER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&display=swap" rel="stylesheet">
<style>
/* Layout: barra de etapas arriba, una vista por etapa, resumen antes del detalle. */
:root {
  color-scheme: light;
  --bg: #f3f5f4; --surface: #ffffff; --ink: #16201e; --muted: #56625f; --line: #d8dedc;
  --accent: #0f6b6e; --accent-soft: #e1eeee; --mark: #2a78d6; --mark2: #eb6834;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --font-body: "IBM Plex Sans", system-ui, sans-serif;
  --font-display: "IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f1413; --surface: #191f1e; --ink: #e7edeb; --muted: #9ba9a5; --line: #2e3836;
    --accent: #56bcbd; --accent-soft: #17302f; --mark: #3987e5; --mark2: #d95926;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1413; --surface: #191f1e; --ink: #e7edeb; --muted: #9ba9a5; --line: #2e3836;
  --accent: #56bcbd; --accent-soft: #17302f; --mark: #3987e5; --mark2: #d95926;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); }
a { color: var(--accent); }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px 64px; }
header.top { padding: 28px 0 14px; }
header.top h1 { font: 600 30px/1.15 var(--font-display); margin: 0 0 6px; text-wrap: balance; }
header.top p { margin: 0; color: var(--muted); max-width: 68ch; }
nav { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 0; position: sticky; top: 0; background: var(--bg); z-index: 5; border-bottom: 1px solid var(--line); }
nav a { text-decoration: none; color: var(--muted); padding: 7px 12px; border-radius: 6px; font-weight: 500; font-size: 14px; }
nav a .n { font-family: var(--font-mono); font-size: 12px; margin-right: 6px; opacity: .8; }
nav a:hover { color: var(--ink); background: var(--accent-soft); }
nav a[aria-current="page"] { background: var(--accent); color: var(--surface); }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
section.view { display: none; padding-top: 24px; }
section.view.on { display: block; }
h2 { font: 600 22px/1.2 var(--font-display); margin: 0 0 4px; text-wrap: balance; }
h3 { font-size: 15px; font-weight: 600; margin: 0 0 8px; }
.lead { color: var(--muted); max-width: 70ch; margin: 0 0 18px; }
.grid { display: grid; gap: 14px; }
.tiles { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); margin-bottom: 18px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
.tile .v { font: 600 30px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.tile .v small { font-size: 16px; color: var(--muted); font-weight: 500; }
.tile .k { color: var(--muted); font-size: 13px; margin-top: 4px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
.two { grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); align-items: start; }
@media (max-width: 820px) { .two { grid-template-columns: minmax(0, 1fr); } }
.note { border-left: 3px solid var(--warning); background: var(--surface); padding: 10px 14px; border-radius: 0 6px 6px 0; color: var(--muted); font-size: 14px; margin: 0 0 18px; max-width: 80ch; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.pick { cursor: pointer; }
tr.pick:hover td, tr.sel td { background: var(--accent-soft); }
.mono { font-family: var(--font-mono); font-size: 13px; }
.pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px 1px 7px; font-size: 12.5px; white-space: nowrap; background: var(--surface); }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.pill.good i { background: var(--good); } .pill.warning i { background: var(--warning); }
.pill.serious i { background: var(--serious); } .pill.critical i { background: var(--critical); }
.stage { display: block; text-decoration: none; color: inherit; }
.stage:hover { border-color: var(--accent); }
.stage .tag { font-family: var(--font-mono); font-size: 12px; color: var(--accent); }
.stage p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.stages { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.filters { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; align-items: end; }
label.f { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
select, button { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
button { cursor: pointer; } button:hover { border-color: var(--accent); }
svg text { font-family: var(--font-body); fill: var(--ink); }
svg .muted { fill: var(--muted); }
.asset { cursor: pointer; }
.asset rect { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
.asset:hover rect, .asset.sel rect { stroke: var(--accent); stroke-width: 2; }
.flow { fill: none; stroke: var(--muted); stroke-width: 1.4; opacity: .55; }
.flow.bad { stroke: var(--critical); stroke-dasharray: 6 4; stroke-width: 2; opacity: .95; }
.flow.hi { stroke-width: 3.5; opacity: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; color: var(--muted); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 22px; height: 0; border-top: 2px solid var(--muted); }
.sw.bad { border-top: 2px dashed var(--critical); }
.sq { width: 12px; height: 12px; border-radius: 3px; }
.matrix { display: grid; grid-template-columns: 28px repeat(5, minmax(0, 1fr)); gap: 2px; font-size: 12px; }
.matrix .ax { display: flex; align-items: center; justify-content: center; color: var(--muted); font-variant-numeric: tabular-nums; }
.cell { min-height: 58px; border-radius: 4px; padding: 5px; display: flex; flex-wrap: wrap; gap: 4px; align-content: flex-start; }
.chip { font-family: var(--font-mono); font-size: 11.5px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; cursor: pointer; line-height: 1.6; }
.chip:hover, .chip.sel { border-color: var(--ink); }
.chip.dim { opacity: .3; }
.xc { width: 100%; border: 1px solid transparent; border-radius: 4px; padding: 4px 10px; text-align: right; font-variant-numeric: tabular-nums; }
.xc[aria-pressed="true"] { border-color: var(--ink); }
.rec-pick[aria-pressed="true"] { background: var(--accent); color: var(--surface); border-color: var(--accent); }
table.audit { table-layout: fixed; width: 100%; }
table.audit col.n { width: 44px; } table.audit col.h { width: 152px; }
#audit-rows td { font-size: 13px; vertical-align: top; }
#audit-rows tr.broken td { background: color-mix(in srgb, var(--critical) 12%, var(--surface)); }
#audit-rows tr.first-broken td { box-shadow: inset 0 2px 0 var(--critical); }
#audit-rows td.h { font-family: var(--font-mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
#audit-rows tr.edited td.evt { color: var(--critical); }
.axis-title { font-size: 12px; color: var(--muted); text-align: center; margin-top: 6px; }
dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; font-size: 14px; }
dl.kv dt { color: var(--muted); } dl.kv dd { margin: 0; }
ul.plain { margin: 0; padding-left: 18px; }
#tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--bg); padding: 6px 9px; border-radius: 5px; font-size: 12.5px; max-width: 280px; display: none; z-index: 20; }
.q { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
@media (max-width: 560px) { .q { grid-template-columns: minmax(0, 1fr); } }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.seg span { display: block; padding: 4px 12px; font-variant-numeric: tabular-nums; font-size: 14px; border-left: 1px solid var(--line); }
.seg label:first-child span { border-left: 0; }
.seg input:checked + span { background: var(--accent); color: var(--surface); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: -2px; }
.bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.bar b { display: block; height: 100%; background: var(--mark); border-radius: 0 4px 4px 0; }
.drow { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) 44px; gap: 10px; align-items: center; font-size: 14px; padding: 4px 0; }
.drow .p { text-align: right; font-variant-numeric: tabular-nums; }
button.primary { background: var(--accent); color: var(--surface); border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }
.livecols { grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); align-items: start; margin-top: 14px; }
@media (max-width: 860px) { .livecols { grid-template-columns: minmax(0, 1fr); } }
.livehead { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; justify-content: space-between; }
.attack { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.attack:last-of-type { border-bottom: 0; }
.attack .d { color: var(--muted); font-size: 13.5px; }
.attack .r { grid-column: 1 / -1; min-height: 22px; font-size: 13.5px; color: var(--muted); }
.feed { display: grid; max-height: 520px; overflow-y: auto; }
.ev { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; padding: 8px 0 8px 10px; border-bottom: 1px solid var(--line); border-left: 3px solid var(--line); font-size: 14px; }
.ev .t { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); padding-top: 2px; }
.ev.alert { border-left-color: var(--critical); }
.ev.info { color: var(--muted); }
.ev.new { animation: flash 1.2s ease-out; }
@keyframes flash { from { background: var(--accent-soft); } to { background: transparent; } }
@media (prefers-reduced-motion: reduce) { .ev.new { animation: none; } }
.chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.chart-head span { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.lsw { width: 16px; height: 3px; border-radius: 2px; background: var(--mark); }
.lsw.mark { width: 3px; height: 14px; background: var(--critical); }
.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: -4px 0 14px; }
.progress b { display: block; height: 100%; background: var(--accent); }
.lsw.dash { width: 21px; background: repeating-linear-gradient(90deg, var(--mark2) 0 5px, transparent 5px 8px); }
pre.cmd { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; font: 14px var(--font-mono); overflow-x: auto; margin: 10px 0; }
footer { margin-top: 40px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); padding-top: 14px; }
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <h1>Ciberseguridad OT en redes de distribución con DER</h1>
  <p>Sensor pasivo de Modbus/TCP, laboratorio de detección, modelo de amenazas e indicadores de madurez para redes eléctricas con generación distribuida.</p>
</header>
<nav id="nav" aria-label="Etapas"></nav>

<section class="view" id="v-resumen"></section>
<section class="view" id="v-arquitectura"></section>
<section class="view" id="v-amenazas"></section>
<section class="view" id="v-laboratorio"></section>
<section class="view" id="v-en-vivo"></section>
<section class="view" id="v-expertos"></section>
<section class="view" id="v-madurez"></section>

<footer id="foot"></footer>
</div>
<div id="tip" role="tooltip"></div>

<script>
const DATA = /*__DATA__*/null;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const VIEWS = [
  ["resumen", "", "Resumen"], ["arquitectura", "2", "Arquitectura"], ["amenazas", "3", "Amenazas"],
  ["laboratorio", "4", "Laboratorio"], ["en-vivo", "4", "En vivo"], ["expertos", "4", "Expertos"], ["madurez", "5", "Madurez"]];
const LEVEL_CLASS = { "Crítico": "critical", "Alto": "serious", "Medio": "warning", "Bajo": "good" };
const OUTCOME_CLASS = { "detectado": "good", "sin alertas": "good", "no detectado": "critical", "falso positivo": "critical" };
const pill = (cls, text) => `<span class="pill ${cls}"><i></i>${esc(text)}</span>`;
const assetById = Object.fromEntries(DATA.architecture.assets.map(a => [a.id, a]));
const zoneById = Object.fromEntries(DATA.architecture.zones.map(z => [z.id, z]));
const scenarioById = Object.fromEntries(DATA.lab.scenarios.map(s => [s.id, s]));
const threatById = Object.fromEntries(DATA.threats.map(t => [t.id, t]));
const familyById = Object.fromEntries(DATA.families.map(f => [f.id, f]));
const levelOf = score => DATA.levels.slice().sort((a, b) => b.min - a.min).find(l => score >= l.min).name;
const labStatus = t => t.lab_scenario ? scenarioById[t.lab_scenario].outcome : "no evaluado";

/* Navegación */
$("#nav").innerHTML = VIEWS.map(([id, n, name]) =>
  `<a href="#${id}" data-v="${id}">${n ? `<span class="n">E${n}</span>` : ""}${name}</a>`).join("");
function route() {
  const id = VIEWS.some(v => v[0] === location.hash.slice(1)) ? location.hash.slice(1) : "resumen";
  document.querySelectorAll("section.view").forEach(s => s.classList.toggle("on", s.id === "v-" + id));
  document.querySelectorAll("#nav a").forEach(a => a.dataset.v === id ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
}
addEventListener("hashchange", route);

/* Tooltip */
const tip = $("#tip");
document.addEventListener("mousemove", e => {
  const el = e.target.closest ? e.target.closest("[data-tip]") : null;
  if (!el) { tip.style.display = "none"; return; }
  tip.textContent = el.dataset.tip; tip.style.display = "block";
  const w = tip.offsetWidth, x = Math.min(e.clientX + 14, innerWidth - w - 8);
  tip.style.left = x + "px"; tip.style.top = (e.clientY + 16) + "px";
});

/* ---------- Resumen ---------- */
(function () {
  const s = DATA.lab.summary, v = DATA.validation;
  const crit = DATA.threats.filter(t => t.level === "Crítico").length;
  const tp = DATA.third_party, tpAttacks = tp ? tp.captures.filter(c => c.description !== "Operación normal") : [];
  $("#v-resumen").innerHTML = `
  <p class="note">El sensor se ejecutó de verdad sobre el laboratorio emulado y sobre capturas públicas de equipos reales. La arquitectura es un escenario hipotético, las ponderaciones de riesgo son provisionales y las respuestas de expertos son sintéticas.</p>
  <div class="grid tiles">
    <div class="tile"><div class="v">${v.violations} <small>de ${v.flows.length}</small></div><div class="k">flujos que violan la segmentación</div></div>
    <div class="tile"><div class="v">${crit} <small>de ${DATA.threats.length}</small></div><div class="k">amenazas de nivel crítico</div></div>
    ${tp ? `<div class="tile"><div class="v">${tpAttacks.filter(c => c.rules.length).length} <small>de ${tpAttacks.length}</small></div><div class="k">ataques detectados en capturas públicas de equipos reales</div></div>` : ""}
    <div class="tile"><div class="v">${s.detected} <small>de ${s.attacks}</small></div><div class="k">ataques detectados en el laboratorio emulado</div></div>
    <div class="tile"><div class="v">${s.baseline_alerts}</div><div class="k">alertas en operación normal, emulada y real</div></div>
  </div>
  <div class="grid stages">
    <a class="card stage" href="#laboratorio"><span class="tag">Herramienta</span><h3>Sensor pasivo de Modbus/TCP</h3><p>Lee una captura o una interfaz de red, arma el inventario, aprende la operación normal, alerta ante desvíos y deja un registro auditable. Nunca transmite.</p></a>
    <a class="card stage" href="#arquitectura"><span class="tag">Etapa 2</span><h3>Arquitectura de referencia</h3><p>Zonas, activos y conductos descritos como datos. Un validador marca los flujos que no pasan por un conducto declarado.</p></a>
    <a class="card stage" href="#amenazas"><span class="tag">Etapa 3</span><h3>Modelo de amenazas</h3><p>Amenazas por zona con sus controles y marcos, ponderadas por probabilidad e impacto y asociadas a MITRE ATT&amp;CK for ICS.</p></a>
    <a class="card stage" href="#laboratorio"><span class="tag">Etapa 4</span><h3>Evaluación en laboratorio</h3><p>Un inversor Modbus emulado recibe ${s.attacks} ataques. El sensor pasivo analiza la captura con una política manual y con una línea base que aprende solo.</p></a>
    <a class="card stage" href="#en-vivo"><span class="tag">Etapa 4</span><h3>El sensor en acción</h3><p>Reproducción del sensor analizando capturas de equipos reales. Con el servidor local, el laboratorio en tiempo real.</p></a>
    <a class="card stage" href="#expertos"><span class="tag">Etapa 4</span><h3>Consulta a expertos</h3><p>Acuerdo entre expertos medido con el coeficiente W de Kendall y comparado con el modelo.</p></a>
    <a class="card stage" href="#madurez"><span class="tag">Etapa 5</span><h3>Indicadores de madurez</h3><p>Autoevaluación de 18 preguntas para distribuidoras y cooperativas, con puntaje y recomendaciones.</p></a>
  </div>`;
})();

/* ---------- Arquitectura ---------- */
(function () {
  const A = DATA.architecture, V = DATA.validation;
  const W = 800, BH = 96, LX = 150, BW = 140, BX = 44;
  const pos = {};
  A.zones.forEach((z, zi) => {
    const list = A.assets.filter(a => a.zone === z.id);
    list.forEach((a, i) => { pos[a.id] = { x: LX + (W - LX) * (i + 1) / (list.length + 1), y: zi * BH + BH / 2, zi }; });
  });
  const H = A.zones.length * BH;
  function path(f) {
    const s = pos[f.src], d = pos[f.dst];
    if (s.zi === d.zi) {
      const dir = d.x > s.x ? 1 : -1;
      return `M${s.x + dir * BW / 2},${s.y} L${d.x - dir * BW / 2},${d.y}`;
    }
    const dir = d.zi > s.zi ? 1 : -1;
    const y1 = s.y + dir * BX / 2, y2 = d.y - dir * BX / 2, my = (y1 + y2) / 2;
    return `M${s.x},${y1} C${s.x},${my} ${d.x},${my} ${d.x},${y2}`;
  }
  const bands = A.zones.map((z, i) => `
    <rect x="0" y="${i * BH}" width="${W}" height="${BH - 4}" rx="6" fill="var(--accent-soft)" opacity="${i % 2 ? .55 : .9}"/>
    <text x="12" y="${i * BH + 26}" font-size="14" font-weight="600">${esc(z.short || z.name)}</text>
    <text x="12" y="${i * BH + 44}" font-size="12" class="muted">${esc(z.purdue)}</text>`).join("");
  const flows = V.flows.map(f => `<path id="fl-${f.id}" class="flow ${f.status === "violación" ? "bad" : ""}" d="${path(f)}" marker-end="url(#${f.status === "violación" ? "arB" : "arA"})" data-tip="${esc(f.id + ": " + assetById[f.src].name + " → " + assetById[f.dst].name + " (" + f.protocol + ", puerto " + f.port + "). " + f.reason)}"/>`);
  const boxes = A.assets.map(a => { const p = pos[a.id]; return `
    <g class="asset" id="as-${a.id}" data-id="${a.id}" tabindex="0" role="button" aria-label="${esc(a.name)}">
      <rect x="${p.x - BW / 2}" y="${p.y - BX / 2}" width="${BW}" height="${BX}" rx="6"/>
      <text x="${p.x}" y="${p.y - 1}" text-anchor="middle" font-size="13" font-weight="500">${esc(a.name)}</text>
      <text x="${p.x}" y="${p.y + 14}" text-anchor="middle" font-size="11" class="muted" font-family="var(--font-mono)">${a.ip}</text>
    </g>`; }).join("");
  $("#v-arquitectura").innerHTML = `
  <h2>Arquitectura de referencia</h2>
  <p class="lead">${A.zones.length} zonas unidas por ${A.conduits.length} conductos. De ${V.flows.length} flujos declarados, ${V.violations} cruzan entre zonas sin un conducto que los permita. Es un escenario hipotético, no un despliegue real. Seleccioná un activo para ver sus amenazas.</p>
  <div class="grid two">
    <div class="card">
      <div class="scroll"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:640px" role="img" aria-label="Diagrama de zonas, activos y flujos">
        <defs>
          <marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker>

    <p style="color:var(--muted);font-size:14px;margin:0 0 10px;max-width:86ch">Cada alerta se agrega a un archivo donde cada línea guarda el hash de la anterior (<span class="mono">results/audit.jsonl</span>). Estos son los registros reales de la ejecución del laboratorio. Probá a alterar uno: la verificación se hace acá mismo, recalculando SHA-256 sobre el contenido.</p>

    </table>
    <p style="color:var(--muted);font-size:13px;margin-bottom:0">Maestro autorizado: <span class="mono">${s.policy.authorized_masters.join(", ")}</span>. Límite de potencia admitido: ${s.policy.registers["10"].min} a ${s.policy.registers["10"].max} %.<br>Cada alerta de esta ejecución quedó en un registro encadenado por hashes (<span class="mono">results/audit.jsonl</span>), que la integración continua verifica en cada subida.</p></div>
  </div>`;

  /* Verificación de la cadena, recalculada en el navegador */
  (function () {
    const original = DATA.audit || [];
    if (!original.length) { const c = $("#audit-rows"); if (c) c.closest(".card").remove(); return; }
    let records = original.map(r => JSON.parse(JSON.stringify(r)));
    let edited = null;
    const canon = v => v === null || typeof v !== "object" ? JSON.stringify(v)
      : Array.isArray(v) ? "[" + v.map(canon).join(",") + "]"
      : "{" + Object.keys(v).sort().map(k => JSON.stringify(k) + ":" + canon(v[k])).join(",") + "}";
    async function sha256(text) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
      return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
    }
    async function verify(list) {
      let prev = "0".repeat(64);
      for (let i = 0; i < list.length; i++) {
        const r = list[i];
        if (r.seq !== i) return { ok: false, at: i, reason: `número fuera de orden: ${r.seq}, se esperaba ${i}` };
        if (r.prev !== prev) return { ok: false, at: i, reason: "no encadena con el registro anterior" };
        if (await sha256(prev + canon({ seq: r.seq, time: r.time, event: r.event })) !== r.hash)
          return { ok: false, at: i, reason: "el contenido no coincide con su hash" };
        prev = r.hash;
      }
      return { ok: true, at: null, last: prev };
    }
    function label(e) {
      if (e.kind === "alerta") return `<span class="mono">${e.rule}</span> ${esc(e.name)} · ${esc(e.detail)}`;
      if (e.kind === "escenario") return `Escenario <span class="mono">${e.id}</span> ${esc(e.name)} · ${esc(e.outcome)}`;
      if (e.kind === "inicio") return `Inicio de <span class="mono">${esc(e.command)}</span>`;
      if (e.kind === "fin") return `Fin: ${e.detected} de ${e.attacks} ataques detectados`;
      return esc(e.kind);
    }
    async function draw() {
      const state = await verify(records);
      $("#audit-state").className = "pill " + (state.ok ? "good" : "critical");
      $("#audit-state").innerHTML = `<i></i>${state.ok ? "Cadena íntegra, " + records.length + " registros" : "Cadena rota en el registro " + state.at}`;
      $("#audit-why").innerHTML = state.ok
        ? `<span style="color:var(--muted)">Cada registro encadena con el anterior. Último hash: <span class="mono" style="font-size:12.5px">${state.last.slice(0, 32)}…</span></span>`
        : `${esc(state.reason)}. Los primeros ${state.at} registros siguen siendo confiables; desde ahí el registro no sirve como evidencia.`;
      $("#audit-rows").innerHTML = records.map((r, i) => {
        const bad = !state.ok && i >= state.at;
        return `<tr class="${bad ? "broken" : ""} ${!state.ok && i === state.at ? "first-broken" : ""} ${i === edited ? "edited" : ""}"><td class="num">${r.seq}</td><td class="evt">${label(r.event)}</td><td class="h">${r.hash.slice(0, 14)}…</td></tr>`;
      }).join("");
    }
    $("#audit-edit").addEventListener("click", () => {
      const i = records.findIndex(r => r.event.kind === "alerta" && (r.event.source || "").endsWith(".99"));
      if (i < 0) return;
      const swap = t => String(t).replace(/10\.10\.40\.99/g, "10.10.15.30");
      records[i].event = { ...records[i].event, source: swap(records[i].event.source), detail: swap(records[i].event.detail) };
      edited = i;
      draw();
    });
    $("#audit-drop").addEventListener("click", () => {
      const i = records.findIndex(r => r.event.kind === "alerta");
      if (i < 0) return;
      records.splice(i, 1);
      edited = null;
      draw();
    });
    $("#audit-reset").addEventListener("click", () => {
      records = original.map(r => JSON.parse(JSON.stringify(r)));
      edited = null;
      draw();
    });
    draw();
  })();
})();

  function startRecorded() {

    root.innerHTML = `

    <div class="filters" style="margin-bottom:10px">${recs.map((r, i) => `<button type="button" class="rec-pick" data-i="${i}" aria-pressed="${i === 0}">${esc(r.title)}</button>`).join("")}</div>

    let timer = null;
    function inventoryAt(rec, f) {
      let devices = [];
      for (const s of rec.shapes) if (s.frame <= f) devices = s.devices;
      const counts = rec.frames[f][3];
      return devices.map((d, i) => ({ ...d, requests: counts[i] || 0, writes: Object.fromEntries(Object.entries(d.writes).map(([r, w]) => [r, { min: w[0], max: w[1] }])) }));
    }
    function load(i) {
      clearInterval(timer);
      const rec = recs[i];
      document.querySelectorAll(".rec-pick").forEach(b => b.setAttribute("aria-pressed", +b.dataset.i === i));
      $("#rec-desc").textContent = `${rec.description} ${rec.policy_label}.`;
      $("#rec-src").textContent = rec.source ? `Captura ${rec.capture}. Fuente: ${rec.source}.` : `Captura ${rec.capture}.`;
      let speed = 60;
      const show = (f, playing) => { const fr = rec.frames[f]; view.state({ elapsed: fr[0], total: rec.seconds, speed, requests: fr[1], rate: fr[2], inventory: inventoryAt(rec, f), playing, finished: f === rec.frames.length - 1 }); };
      function play() {
        clearInterval(timer);
        view.clear();
        let elapsed = 0, f = -1, shown = 0;
        timer = setInterval(() => {
          elapsed += 0.1 * speed;
          while (shown < rec.alerts.length && rec.alerts[shown].second <= elapsed) view.alert(rec.alerts[shown++]);
          let moved = false;
          while (f + 1 < rec.frames.length && rec.frames[f + 1][0] <= elapsed) { f++; moved = true; show(f, f < rec.frames.length - 1); }
          if (f === rec.frames.length - 1) clearInterval(timer);
        }, 100);
      }
      const view = replayView($("#rec-box"), rec, { restart: play, speed: v => { speed = v; view.state && $("#rec-box [data-r=speed]") && ($("#rec-box [data-r=speed]").textContent = `actual ${v}×`); } });
      /* En reposo se muestra el resultado completo */
      rec.frames.forEach((_, f) => show(f, false));
      rec.alerts.forEach(a => view.alert(a, false));
    }

    load(0);
  }

    const hist = []; let alerts = 0, busy = false;

        <path d="${path(key)}" fill="none" stroke="var(--mark)" stroke-width="2" stroke-linejoin="round"/>` : ""}
        ${key2 && pts.length > 1 ? `<path d="${path(key2)}" fill="none" stroke="var(--mark2)" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>` : ""}
        ${last ? `<circle cx="${x(last.t)}" cy="${y(last[key])}" r="4" fill="var(--mark)" stroke="var(--surface)" stroke-width="2"/>` : ""}
        ${last && key2 && last[key2] !== last[key] ? `<circle cx="${x(last.t)}" cy="${y(last[key2])}" r="4" fill="var(--mark2)" stroke="var(--surface)" stroke-width="2"/>` : ""}`;

      hist.push({ t: s.time, pot: s.potencia_w, rep, rate: s.solicitudes_por_segundo });
      while (hist.length > 200) hist.shift();
      chart("#lv-chart-pot", "pot", "#lv-c-pot", "W", 4000, "rep");
      chart("#lv-chart-rate", "rate", "#lv-c-rate", "por segundo", 50);
    });
    es.addEventListener("alert", e => {
      const a = JSON.parse(e.data); alerts++; $("#lv-al").textContent = alerts;
      addEvent(`${pill(a.severity === "alta" ? "serious" : "warning", "Alerta " + a.severity)} <span class="mono">${a.rule}</span> <b>${esc(a.name)}</b> <span class="mono">${a.technique}</span><br>${esc(a.detail)} · origen <span class="mono">${a.source}</span>`, "alert", a.time);
    });
    es.addEventListener("attack", e => { const a = JSON.parse(e.data); addEvent(`Ataque lanzado: <span class="mono">${a.id}</span> ${esc(a.name)}`, "info", a.time); });
    es.addEventListener("reset", e => addEvent("Inversor restablecido: límite 100 % y conectado", "info", JSON.parse(e.data).time));
  }
})();

/* ---------- Expertos ---------- */
(function () {
  const E = DATA.experts;
  const items = E.items.slice().sort((a, b) => b.median - a.median || a.id.localeCompare(b.id));
  const W = 640, RH = 26, LX = 300, PW = W - LX - 20, H = items.length * RH + 30;
  const x = v => LX + (v - 1) / 4 * PW;
  const rows = items.map((it, i) => {
    const y = i * RH + RH / 2, t = threatById[it.id];
    const title = t.title.length > 38 ? t.title.slice(0, 37) + "…" : t.title;
    return `<g data-tip="${esc(it.id + " " + t.title + ". Mediana " + it.median + ", rango intercuartil " + it.q1 + " a " + it.q3 + ".")}">
      <rect x="0" y="${i * RH}" width="${W}" height="${RH}" fill="transparent"/>
      <text x="0" y="${y + 4}" font-size="12" font-family="var(--font-mono)">${it.id}</text>
      <text x="36" y="${y + 4}" font-size="12.5">${esc(title)}</text>
      <line x1="${x(it.q1)}" x2="${x(it.q3)}" y1="${y}" y2="${y}" stroke="var(--mark)" stroke-width="6" stroke-linecap="round" opacity=".35"/>
      <circle cx="${x(it.median)}" cy="${y}" r="5.5" fill="var(--mark)" stroke="var(--surface)" stroke-width="2"/>
    </g>`;
  }).join("");
  const grid = [1, 2, 3, 4, 5].map(v => `<line x1="${x(v)}" x2="${x(v)}" y1="0" y2="${items.length * RH}" stroke="var(--line)"/><text x="${x(v)}" y="${items.length * RH + 18}" font-size="12" text-anchor="middle" class="muted">${v}</text>`).join("");
  const agree = E.items.filter(i => i.consensus).length;
  $("#v-expertos").innerHTML = `
  <h2>Consulta a expertos</h2>
  <p class="note">Las respuestas de esta vista son sintéticas, generadas para mostrar el análisis. Se reemplazan cargando el CSV real de la consulta.</p>
  <p class="lead">Cada experto califica la relevancia de cada amenaza de 1 a 5. El coeficiente W de Kendall mide el acuerdo general: 0 es ninguno y 1 es total.</p>
  <div class="grid tiles">
    <div class="tile"><div class="v">${E.experts}</div><div class="k">expertos consultados</div></div>
    <div class="tile"><div class="v">${E.kendall_w.toFixed(2)}</div><div class="k">W de Kendall (acuerdo general)</div></div>
    <div class="tile"><div class="v">${agree} <small>de ${E.items.length}</small></div><div class="k">amenazas con consenso (rango intercuartil de 1 o menos)</div></div>
    <div class="tile"><div class="v">${E.spearman_vs_model.toFixed(2)}</div><div class="k">correlación de Spearman con el riesgo del modelo</div></div>
  </div>
  <div class="card"><h3>Relevancia según los expertos, por amenaza</h3>
    <div class="scroll"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:560px;max-width:820px" role="img" aria-label="Mediana y rango intercuartil de relevancia por amenaza">${grid}${rows}</svg></div>
    <div class="legend"><span><svg width="14" height="14"><circle cx="7" cy="7" r="5" fill="var(--mark)"/></svg>Mediana</span><span><svg width="26" height="14"><line x1="3" x2="23" y1="7" y2="7" stroke="var(--mark)" stroke-width="6" stroke-linecap="round" opacity=".35"/></svg>Rango intercuartil</span><span>Escala: 1 poco relevante, 5 muy relevante</span></div>
  </div>`;
})();

/* ---------- Madurez ---------- */
(function () {
  const M = DATA.maturity, KEY = "der-ot-madurez-v1";
  const qs = M.domains.flatMap(d => d.questions.map(q => ({ ...q, domain: d.id })));
  const EXAMPLE = { q1: 1, q2: 1, q3: 0, q4: 1, q5: 2, q6: 1, q7: 2, q8: 1, q9: 0, q10: 0, q11: 0, q12: 1, q13: 1, q14: 2, q15: 3, q16: 1, q17: 1, q18: 0 };
  let ans = null, isExample = true;
  try { const saved = JSON.parse(localStorage.getItem(KEY)); if (saved && typeof saved === "object") { ans = saved; isExample = false; } } catch (e) {}
  if (!ans) ans = { ...EXAMPLE };
  const root = $("#v-madurez");
  root.innerHTML = `
  <h2>Indicadores de madurez</h2>
  <p class="lead">Autoevaluación para distribuidoras y cooperativas. Cada afirmación se califica de 0 a 3. ${esc(M.meta.note)}</p>
  <p class="note" id="m-state"></p>
  <div class="grid two">
    <div class="card">
      <div class="legend" style="margin:0 0 10px">${M.meta.levels.map((l, i) => `<span><b>${i}</b> ${esc(l)}</span>`).join("")}</div>
      ${M.domains.map(d => `<h3 style="margin-top:16px">${esc(d.name)}</h3>${d.questions.map(q => `<div class="q"><div>${esc(q.text)}</div><div class="seg" role="radiogroup" aria-label="${esc(q.text)}">${[0, 1, 2, 3].map(v => `<label data-tip="${esc(M.meta.levels[v])}"><input type="radio" name="${q.id}" id="${q.id}-${v}" value="${v}"><span>${v}</span></label>`).join("")}</div></div>`).join("")}`).join("")}
      <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap"><button id="m-clear" type="button">Borrar respuestas</button><button id="m-example" type="button">Cargar el ejemplo</button></div>
    </div>
    <div class="grid">
      <div class="card"><h3>Resultado</h3><div class="tile" style="border:0;padding:0"><div class="v" id="m-score"></div><div class="k" id="m-count"></div></div><div id="m-radar" style="margin-top:8px"></div><div id="m-bars"></div></div>
      <div class="card"><h3>Prioridades de mejora</h3><div id="m-advice"></div></div>
    </div>
  </div>`;
  function draw() {
    qs.forEach(q => [0, 1, 2, 3].forEach(v => { $(`#${q.id}-${v}`).checked = ans[q.id] === v; }));
    $("#m-state").textContent = isExample ? "Se muestran respuestas de ejemplo de una cooperativa tipo. Al cambiar cualquier respuesta, la evaluación pasa a ser la tuya y se guarda solo en este navegador." : "Tus respuestas se guardan solo en este navegador.";
    const dom = M.domains.map(d => {
      const vals = d.questions.map(q => ans[q.id]).filter(v => v != null);
      return { name: d.name, pct: vals.length ? vals.reduce((a, b) => a + b, 0) / (vals.length * 3) : 0, n: vals.length };
    });
    const all = qs.map(q => ans[q.id]).filter(v => v != null);
    const total = all.length ? Math.round(all.reduce((a, b) => a + b, 0) / (all.length * 3) * 100) : 0;
    $("#m-score").innerHTML = `${total} <small>%</small>`;
    $("#m-count").textContent = `madurez general, con ${all.length} de ${qs.length} respuestas`;
    const R = 88, C = 185, n = dom.length;
    const pt = (i, r) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [C + r * Math.cos(a), 125 + r * Math.sin(a)]; };
    const ring = f => dom.map((_, i) => pt(i, R * f).join(",")).join(" ");
    $("#m-radar").innerHTML = `<svg viewBox="0 0 370 250" width="100%" style="max-width:400px;display:block;margin:auto" role="img" aria-label="Madurez por dominio">
      ${[1 / 3, 2 / 3, 1].map(f => `<polygon points="${ring(f)}" fill="none" stroke="var(--line)"/>`).join("")}
      ${dom.map((_, i) => { const [x, y] = pt(i, R); return `<line x1="${C}" y1="125" x2="${x}" y2="${y}" stroke="var(--line)"/>`; }).join("")}
      <polygon points="${dom.map((d, i) => pt(i, R * d.pct).join(",")).join(" ")}" fill="var(--mark)" fill-opacity=".22" stroke="var(--mark)" stroke-width="2" stroke-linejoin="round"/>
      ${dom.map((d, i) => { const [x, y] = pt(i, R * d.pct); return `<circle cx="${x}" cy="${y}" r="4" fill="var(--mark)" stroke="var(--surface)" stroke-width="2" data-tip="${esc(d.name)}: ${Math.round(d.pct * 100)} %"/>`; }).join("")}
      ${dom.map((d, i) => { const [x, y] = pt(i, R + 14); const w = d.name.split(" "); return `<text x="${x}" y="${y + 4}" font-size="11" class="muted" text-anchor="${Math.abs(x - C) < 5 ? "middle" : x > C ? "start" : "end"}">${esc(w[0])}</text>`; }).join("")}
    </svg>`;
    $("#m-bars").innerHTML = dom.map(d => `<div class="drow"><span>${esc(d.name)}</span><div class="bar"><b style="width:${d.pct * 100}%"></b></div><span class="p">${Math.round(d.pct * 100)} %</span></div>`).join("");
    const low = qs.filter(q => ans[q.id] != null && ans[q.id] <= 1).sort((a, b) => ans[a.id] - ans[b.id]).slice(0, 5);
    $("#m-advice").innerHTML = low.length ? `<ol class="plain">${low.map(q => `<li style="margin-bottom:6px">${esc(q.advice)} <span style="color:var(--muted);font-size:13px">(nivel actual ${ans[q.id]})</span></li>`).join("")}</ol>`
      : `<p style="color:var(--muted);font-size:14px;margin:0">${all.length ? "Ninguna respuesta está en nivel 0 o 1." : "Respondé el cuestionario para ver las prioridades."}</p>`;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(ans)); } catch (e) {} }
  root.addEventListener("change", e => {
    if (e.target.type !== "radio") return;
    ans[e.target.name] = +e.target.value; isExample = false; save(); draw();
  });
  $("#m-clear").addEventListener("click", () => { ans = {}; isExample = false; save(); draw(); });
  $("#m-example").addEventListener("click", () => { ans = { ...EXAMPLE }; isExample = true; try { localStorage.removeItem(KEY); } catch (e) {} draw(); });
  draw();
})();

$("#foot").textContent = "Prototipo de investigación. El sensor fue validado con un laboratorio emulado y con cuatro capturas públicas; no fue probado en una red en operación.";
route();
</script>
</body>
</html>
